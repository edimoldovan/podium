[package]
name = "podium"
version = "0.1.0"
edition = "2024"
authors = ["Eduard Moldovan"]
description = "Presentations built from a storyline"

[[bin]]
name = "podium"
path = "src/main.rs"

[dependencies]
anyrender = "0.14.0"
anyrender_13 = { package = "anyrender", version = "0.13" }
anyrender_vello_cpu = { version = "0.18.0", default-features = false }
base64 = "0.22"
blitz-dom = { version = "=0.3.0-beta.3", default-features = false, features = ["system-fonts", "svg"] }
blitz-html = { version = "=0.3.0-beta.3", default-features = false }
blitz-paint = { version = "=0.3.0-beta.3", default-features = false, features = ["svg"] }
blitz-traits = "=0.3.0-beta.3"
eframe = "0.33.3"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
omarchy-kit = { git = "https://github.com/edimoldovan/omarchy-kit.git", rev = "6f22c3c422496157ff1810ee1fe77fe119ac5462" }
pdfrum-anyrender = "0.5.3"
peniko = "0.6"
rfd = "0.17.2"
rust_xlsxwriter = { version = "0.101.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
egui_kittest = "0.33.3"
